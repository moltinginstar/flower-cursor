[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flower-cursor"
version = "0.1.0"
description = "A living flower cursor for Kitty"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
# The cursor is a PTY wrapper: it needs `pty`, `termios`, `tty`, `fcntl`,
# `pwd` and process groups, none of which Windows has. Packaging metadata
# cannot refuse an install outright, so the classifiers are what say so.
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.14",
  "Topic :: Terminals :: Terminal Emulators/X Terminals",
]
dependencies = [
  # 11.x publishes no cp314 wheels, so the floor has to be a release that
  # does or a fresh resolve can only satisfy it by building from source.
  "pillow>=12.0",
]

[project.urls]
Homepage = "https://github.com/moltinginstar/flower-cursor"
Source = "https://github.com/moltinginstar/flower-cursor"

[project.optional-dependencies]
# Wingbeat audio for the idle bee. Optional because the cursor is complete
# without it, and because an audio backend is a native dependency.
sound = ["miniaudio>=1.71"]

[project.scripts]
flower-cursor = "flower_cursor.observer:shell_main"

[tool.hatch.build.targets.wheel]
packages = ["src/flower_cursor"]

[dependency-groups]
dev = [
  "pytest>=9.1",
  # `requires-python = ">=3.14"` needs a ruff that knows about 3.14.
  "ruff>=0.16",
  # The same backend the `sound` extra installs, repeated because `uv run`
  # re-syncs the environment to the default set and uninstalls anything an
  # earlier `uv sync --extra sound` put there, so a checkout that wants to
  # hear the bee loses the audio device on the next test run. uv has no way
  # for a group to pull in an extra, so this is the documented shape. It says
  # nothing about how the package installs: `pip install flower-cursor` is
  # still audio-free, and `flower-cursor[sound]` is still how a user asks.
  "miniaudio>=1.71",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
indent-width = 2

[tool.ruff.lint]
ignore = ["E722", "E731", "F722"]
extend-select = ["I"]
