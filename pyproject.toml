[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flower-cursor"
version = "0.1.0"
description = "A living flower cursor for Kitty"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pillow>=11.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
